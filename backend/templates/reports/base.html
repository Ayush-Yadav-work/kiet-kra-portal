<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ doc_title }}</title>
<style>
{{ font_css|safe }}
@page { size: {{ page.css_size }}; }
html, body { margin: 0; padding: 0; }
body { font-family: "Tinos", "Times New Roman", serif; font-size: 12pt; line-height: 1.18; color: #000; background: #fff;
       -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.screen-header { display: none; }
.preview .screen-header { display: block; height: {{ page.margins.top }}; overflow: hidden; }
.preview .page { width: {{ page.width }}; margin: 0 auto 24px; box-shadow: 0 1px 6px rgba(0,0,0,.25);
                 box-sizing: border-box; min-height: {{ page.height }}; background: #fff; }
.preview { background: #e5e7eb; padding: 16px 0; }
.preview .content { padding: 0 {{ page.margins.right }} {{ page.margins.bottom }} {{ page.margins.left }}; }
h1.title { font-size: 11pt; font-weight: bold; text-decoration: underline; text-align: center; margin: 0 0 4pt; }
h2 { font-size: 14pt; font-weight: bold; margin: 12pt 0 2pt; break-after: avoid; }
p { margin: 0 0 4pt; text-align: justify; }
p.lead { break-after: avoid; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 0.75pt solid #000; padding: 3pt 5pt; vertical-align: top; text-align: left; word-wrap: break-word;
         overflow-wrap: anywhere; }
th { font-weight: bold; text-align: center; vertical-align: middle; }
thead { display: table-header-group; }
tr { break-inside: avoid; }
.kv td:first-child { width: 36%; }
.center { text-align: center; }
.empty { color: #9ca3af; font-style: italic; }
ul, ol { margin: 0 0 4pt; padding-left: 36pt; }
li { margin: 0; }
.summary { font-size: 10pt; margin-bottom: 10pt; }
.summary td { padding: 2pt 4pt; }
.summary th { background: #f2f2f2; text-align: left; width: 26%; }
.event-break { break-before: page; }
.event-tag { font-size: 9pt; color: #555; text-align: right; margin: 0 0 2pt; }
.signoff { margin-top: 8pt; font-weight: bold; break-inside: avoid; }
.signoff div { margin: 2pt 0; }
.signoff span.val { font-weight: normal; }
table.records { font-size: 8.5pt; table-layout: fixed; }
table.records th { font-size: 8pt; padding: 2pt 2pt; overflow-wrap: normal; word-break: normal; }
.summary.landscape th { width: 15%; }
table.records td { padding: 2pt 2pt; }
.na { color: #555; }
.bold { font-weight: bold; }
.k11 { font-size: 11pt; }
.k11 .sub { margin: 8pt 0 10pt; font-size: 10.5pt; }
.k11-label { margin: 12pt 0 4pt; text-align: left; }
.k11-head th { text-align: left; width: 58%; font-weight: bold; }
.k11-head td.prose p { margin-bottom: 6pt; }
.k11-head td.prose ul, .k11-head td.prose ol { margin-bottom: 2pt; }
.k11-grid th { font-weight: normal; }
.k11-grid thead th { font-weight: bold; }
.k11-courses { table-layout: fixed; }
.k11-courses th, .k11-courses td { overflow-wrap: break-word; word-break: normal; }
.k11-small td { padding: 1pt 5pt; font-size: 10.5pt; }
.k11-sign { margin-top: 14pt; break-inside: avoid; }
.k11-sign td { width: 50%; padding: 4pt 5pt 12pt; line-height: 1.3; }
.k11 .lines { line-height: 1.25; }
.k11 ol.plain { padding-left: 18pt; }
.k11-docs { break-before: page; }
.keep { break-inside: avoid; }
.fam-details { table-layout: auto; }
.fam-details th { overflow-wrap: normal; word-break: normal; hyphens: none; }
.fdp-title { font-size: 11pt; line-height: 1.25; margin: 0; }
.fdp-sub { margin: 0 0 10pt; font-size: 10.5pt; }
.fdp-label { margin: 10pt 0 2pt; text-align: left; }
.fdp-intro p { margin-top: 2pt; }
.fdp-people { table-layout: fixed; }
.fdp-people th { overflow-wrap: normal; word-break: normal; }
.iv-title { font-size: 13pt; margin: 2pt 0 10pt; }
.iv-label { margin: 10pt 0 3pt; text-align: left; }
.iv-box { margin-top: -0.75pt; }
.iv-inner { margin: 3pt 0 2pt; font-size: 10pt; table-layout: fixed; }
.k11-head .iv-inner th { width: auto; }
.iv-feedback .consolidated-note { break-after: avoid; }
.iv-inner th.left { text-align: left; background: #f2f2f2; }
.iv-dept tr:first-child { break-after: avoid; }
.iv-matrix { table-layout: fixed; font-size: 8.5pt; }
.iv-matrix th, .iv-matrix td { padding: 2pt 1pt; overflow-wrap: normal; word-break: normal; }
.iv-matrix td:first-child { padding: 2pt 3pt; overflow-wrap: anywhere; }
.iv-feedback { margin-top: 8pt; break-inside: avoid; }
.iab .k11-label, .mou .k11-label { break-after: avoid; }
.k23-title { font-size: 13pt; margin: 6pt 0 10pt; }
.k23-head th { font-size: 10pt; }
.k23-head th.k23-big { font-size: 12.5pt; }
.k23-obj { font-size: 13pt; font-weight: bold; margin-bottom: 0 !important; }
.table-note { font-size: 8.5pt; font-style: italic; margin-top: 3pt; }
h3 { font-size: 12pt; font-weight: bold; margin: 8pt 0 2pt; break-after: avoid; }
.survey-title { font-size: 13pt; margin: 4pt 0 8pt; }
.survey-sub { font-size: 10pt; margin: -4pt 0 6pt; }
ul.plain-list { margin: 0; padding-left: 14pt; }
.consolidated-note { font-size: 10pt; font-style: italic; text-align: center; margin-bottom: 8pt; }
table.survey { margin-bottom: 10pt; }
table.survey th.shade, .survey th.shade { background: #f2f2f2; }
table.survey.kv th { text-align: left; width: 36%; }
table.survey.ratings th { font-size: 10pt; }
table.survey.ratings td { font-size: 10.5pt; padding: 2pt 4pt; }
table.survey td.avg, table.survey th.avg { background: #eef3fb; }
table.survey td.caption { font-size: 9pt; font-style: italic; color: #444; }
table.survey th.left { text-align: left; }
table.survey td.tall { height: 40pt; }
.verify { margin-top: 10pt; padding: 4pt 6pt; border: 0.75pt solid #000; font-size: 10pt; break-inside: avoid; }
.verify.pending { border-style: dashed; }
</style>
</head>
<body class="{{ mode }}">
<div class="page">
<div class="screen-header">{{ screen_header|safe }}</div>
<div class="content">
{% block body %}{% endblock %}
</div>
</div>
</body>
</html>
